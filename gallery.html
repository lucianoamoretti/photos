<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Galeria</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <a class="back-link" href="index.html">&#8249; Todas as galerias</a>
  <h1 class="site-title" id="galleryName">Galeria</h1>
  <p class="site-subtitle" id="galleryDesc"></p>
</header>

<main>
  <div class="gallery" id="gallery" role="list" aria-label="Fotos da galeria"></div>

  <p class="empty-state" id="emptyState" hidden>Galeria não encontrada ou ainda sem fotos.</p>
</main>

<footer class="site-footer">
  <p id="footerCopy"></p>
  <p class="footer-note">As imagens são protegidas por direito autoral. O download é permitido
  conforme a licença indicada em cada foto.</p>
</footer>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Visualizador de foto" hidden>
  <button class="lb-btn lb-close" id="lbClose" aria-label="Fechar">&times;</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Foto anterior">&#8249;</button>
  <button class="lb-btn lb-next" id="lbNext" aria-label="Próxima foto">&#8250;</button>

  <figure class="lb-figure">
    <div class="lb-stage">
      <img id="lbImage" alt="">
      <div class="lb-spinner" id="lbSpinner"></div>
    </div>
    <figcaption class="lb-info">
      <div class="lb-meta">
        <h2 class="lb-title" id="lbTitle"></h2>
        <p class="lb-credit" id="lbCredit"></p>
        <p class="lb-license" id="lbLicense"></p>
      </div>
      <a class="lb-download" id="lbDownload" href="#" download>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 19h16"/></svg>
        <span>Baixar</span>
      </a>
    </figcaption>
  </figure>
</div>

<script src="assets/js/gallery.js"></script>
</body>
</html>
